<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: #0c0c0c; }
    #wrap { width: 400px; height: 300px; }
    #cv { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <script>
    // Minimal chrome.* shim so avatar.js's url() resolves assets over the local server.
    window.chrome = { runtime: { getURL: p => '/src/' + p } };
  </script>
  <script type="module">
    import { Avatar } from '/src/popup/avatar.js';
    const cv = document.getElementById('cv');
    const av = new Avatar(cv, { interactive: false, idle: true, life: true });
    window.av = av;

    window.reset = () => {
      av.reactStart = -1e9; av.swipeStart = -1e9;
      av._armManual = null; av.xform = null; av._lifeX = { rot: 0, scale: 1, dx: 0, dy: 0 };
      av.pose = 'open'; av.dir = 'up';
      av._nextBlink = performance.now() + 99999; av._nextGlance = performance.now() + 99999; // suppress during reaction strips
    };

    // Trigger an animation and grab real frames at evenly spaced times across durationMs.
    window.capture = (kind, dir, durationMs, n) => new Promise(res => {
      window.reset();
      requestAnimationFrame(() => {
        if (kind === 'swipe') av.play('open', dir);
        else if (kind === 'idle') { av._nextBlink = performance.now() + 200; } // let it blink/breathe
        else av.react(kind);
        const start = performance.now();
        const times = []; for (let i = 0; i < n; i++) times.push(start + durationMs * i / (n - 1));
        const frames = []; let idx = 0;
        function grab(now) {
          while (idx < n && now >= times[idx]) { frames.push(cv.toDataURL('image/png')); idx++; }
          if (idx < n) requestAnimationFrame(grab); else res(frames);
        }
        requestAnimationFrame(grab);
      });
    });

    // Ready once the base sprite has actually painted (non-trivial PNG size), with a hard timeout.
    window.__ready = false;
    const t0 = performance.now();
    const check = () => {
      try { if (cv.toDataURL('image/png').length > 6000 || performance.now() - t0 > 3000) { window.__ready = true; return; } } catch (e) {}
      setTimeout(check, 80);
    };
    check();
  </script>
</body>
</html>
